name: Send Webmentions

# After every SUCCESSFUL production deploy, so it acts on what's actually
# live — not on a path filter over committed JSON (which markdown-only
# commits from Dispatch never touch) plus a `sleep 60` guess.
on:
  workflow_run:
    workflows: ['Deploy to VPS']
    types: [completed]
  # Hourly too: a scheduled post goes live at publishAt with no deploy, and
  # nothing else would ever announce it. The sent-cache makes reruns no-ops.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# One sender at a time: two runs restoring the same sent-cache double-send.
concurrency:
  group: webmentions
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  webmentions:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    # Use the processed content the deploy built (see deploy.yml)
    - name: Use deployed processed content
      if: github.event_name == 'workflow_run'
      run: rm -rf content/processed

    - name: Download deployed processed content
      if: github.event_name == 'workflow_run'
      uses: actions/download-artifact@v8
      with:
        name: processed-content
        path: content/processed
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    # Scheduled runs: same content, from the latest successful deploy (the
    # committed JSON is only a cache and can lag what's live). Artifacts keep
    # 7 days; if it's gone, fall back to the committed JSON.
    - name: Fetch latest deployed processed content
      if: github.event_name == 'schedule'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        RUN=$(gh run list --workflow 'Deploy to VPS' --branch main --status success -L 1 --json databaseId -q '.[0].databaseId')
        mkdir -p /tmp/deployed
        if gh run download "$RUN" -n processed-content -D /tmp/deployed; then
          rsync -a --delete /tmp/deployed/ content/processed/
        else
          echo "No deploy artifact; using committed content/processed"
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Restore webmentions cache
      uses: actions/cache@v6
      with:
        path: .webmentions-sent.json
        key: webmentions-${{ github.run_id }}
        restore-keys: |
          webmentions-

    # LIVE: ejfox.com is registered at webmention.io and WEBMENTION_IO_TOKEN is
    # set in the VPS .env (both done 2026-09-16), so outbound sending is enabled.
    # This now pings the external sites you link to. To pause it again, re-add
    # ` --dry` — that logs what it WOULD send and does not touch the sent-cache,
    # so nothing is silently skipped when you flip it back on.
    - name: Send webmentions
      run: node scripts/author/send-webmentions.mjs

    - name: Save webmentions cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: .webmentions-sent.json
        key: webmentions-${{ github.run_id }}
