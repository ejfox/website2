name: Send Webmentions

on:
  push:
    branches: [main]
    paths:
      - 'content/processed/**/*.json'
  workflow_dispatch:

jobs:
  webmentions:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Wait for deploy
      run: sleep 60

    - name: Restore webmentions cache
      uses: actions/cache@v4
      with:
        path: .webmentions-sent.json
        key: webmentions-${{ github.sha }}
        restore-keys: |
          webmentions-

    # Gated to --dry (logs what it WOULD send, pings nothing) until inbound
    # webmentions are actually set up: register ejfox.com at webmention.io AND
    # set WEBMENTION_IO_TOKEN in the VPS .env. To go live and start notifying
    # the external sites you link to, delete the ` --dry` below. --dry does not
    # touch the sent-cache, so nothing is silently skipped when you flip it on.
    - name: Send webmentions (dry-run — not pinging external yet)
      run: node scripts/author/send-webmentions.mjs --dry

    - name: Save webmentions cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: .webmentions-sent.json
        key: webmentions-${{ github.sha }}
