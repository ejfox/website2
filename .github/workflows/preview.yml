name: PR Preview

# A real, running preview per PR at https://pr-<number>.preview.ejfox.com:
# the same node-server build production runs, so /api/* routes work.
#
# Build on the runner (never on the VPS — see CLAUDE.md), ship .output plus
# the branch's content/processed and data/ (server routes read them relative
# to cwd), and run it under pm2 as `preview-pr-<n>` on 127.0.0.1:41<n>.
# Caddy maps pr-<n>.preview.ejfox.com → 127.0.0.1:41<n>; when no preview
# server is running it falls back to an old static snapshot, if one exists.
#
# The preview loads production's .env (read-only API keys), so only PRs whose
# workflow can read VPS_SSH_KEY deploy — fork PRs never get repository secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Cancel an in-flight preview build when a newer commit is pushed to the same PR.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

env:
  PR: pr-${{ github.event.number }}
  PORT: 41${{ github.event.number }}

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Process content
        run: yarn blog:process || echo 'blog:process failed — using committed processed content'

      - name: Build (node-server preset)
        run: NITRO_PRESET=node-server yarn build
        env:
          NODE_ENV: production

      - name: Package
        run: |
          test -f .output/server/index.mjs
          tar czf preview.tar.gz .output content/processed data
          echo "Package: $(du -h preview.tar.gz | cut -f1)"

      - name: Copy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: preview.tar.gz
          target: /tmp/${{ env.PR }}/

      - name: Start preview server on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PR,PORT
          script: |
            set -euo pipefail
            BASE="/data2/previews/$PR"
            TARBALL="/tmp/$PR/preview.tar.gz"

            # Extract, verify, then swap — never leave a half-extracted preview
            rm -rf "$BASE.staging" && mkdir -p "$BASE.staging"
            tar xzf "$TARBALL" -C "$BASE.staging"
            test -f "$BASE.staging/.output/server/index.mjs"
            rm -rf "$BASE.old"
            if [ -d "$BASE" ]; then mv "$BASE" "$BASE.old"; fi
            mv "$BASE.staging" "$BASE"
            rm -rf "$BASE.old" "/tmp/$PR"

            # A running server replaces the old static snapshot
            rm -rf "/var/www/previews/$PR"

            cat > "$BASE/ecosystem.config.cjs" <<EOF
            module.exports = {
              apps: [{
                name: "preview-$PR",
                script: ".output/server/index.mjs",
                cwd: "$BASE",
                node_args: "--env-file=/data2/website2/.env",
                max_memory_restart: "350M",
                env: {
                  NODE_ENV: "production",
                  NITRO_HOST: "127.0.0.1",
                  NITRO_PORT: "$PORT",
                  PORT: "$PORT",
                  NUXT_PUBLIC_BASE_URL: "https://$PR.preview.ejfox.com",
                },
              }],
            };
            EOF
            pm2 startOrReload "$BASE/ecosystem.config.cjs" --update-env
            pm2 save

            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/api/healthcheck" || true)
              if [ "$code" = "200" ]; then echo "preview-$PR healthy on :$PORT"; exit 0; fi
              sleep 2
            done
            echo "preview-$PR failed its health check"
            pm2 logs "preview-$PR" --lines 40 --nostream || true
            exit 1

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://pr-${{ github.event.number }}.preview.ejfox.com`
            const marker = '<!-- preview-url -->'
            const body = [
              marker,
              `🚀 **Preview:** ${url}`,
              '',
              `_A running server for \`${context.payload.pull_request.head.sha.slice(0, 7)}\` with live API routes. Refreshed on every push, removed when the PR closes._`
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            })
            const existing = comments.find((c) => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              })
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Stop and remove the preview
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PR
          script: |
            pm2 delete "preview-$PR" 2>/dev/null || true
            pm2 save
            rm -rf "/data2/previews/$PR" "/var/www/previews/$PR"
