name: PR Preview

# Static preview per PR at http://pr-<number>.preview.ejfox.com
# Build -> tar -> scp to VPS -> extract into /var/www/previews/pr-<number>/,
# which Caddy serves via its `@preview host *.preview.ejfox.com` block.
# (No rsync — it isn't installed on the VPS; we use tar+scp like deploy.yml.)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Cancel an in-flight preview build when a newer commit is pushed to the same PR.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Process content
        run: yarn blog:process || echo 'blog:process failed — using committed processed content'

      - name: Build static preview
        run: yarn generate
        env:
          NUXT_PUBLIC_BASE_URL: http://pr-${{ github.event.number }}.preview.ejfox.com
          # Enrich the static snapshot with what secrets we have. Missing ones
          # (e.g. GitHub) just render empty in the preview — non-fatal.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Package static output
        run: tar czf preview.tar.gz -C .output/public .

      - name: Copy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: preview.tar.gz
          target: /tmp/pr-${{ github.event.number }}/

      - name: Extract on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            PR="pr-${{ github.event.number }}"
            DIR="/var/www/previews/$PR"
            TARBALL="/tmp/$PR/preview.tar.gz"
            rm -rf "$DIR" && mkdir -p "$DIR"
            tar xzf "$TARBALL" -C "$DIR"
            rm -rf "/tmp/$PR"
            echo "Deployed $PR ($(find "$DIR" -type f | wc -l) files)"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = `http://pr-${{ github.event.number }}.preview.ejfox.com`
            const marker = '<!-- preview-url -->'
            const body = [
              marker,
              `🚀 **Preview:** ${url}`,
              '',
              '_Static build — API-driven sections show build-time data. Refreshed on every push._'
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            })
            const existing = comments.find((c) => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              })
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove preview from VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: rm -rf "/var/www/previews/pr-${{ github.event.number }}"
