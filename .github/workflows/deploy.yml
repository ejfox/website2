name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_image_guard:
        description: 'Skip the screenshot guard (ONLY if the guard itself is broken — images ship unchecked)'
        type: boolean
        default: false

# One production deploy at a time. Back-to-back merges used to launch
# overlapping runs racing to swap .output on the VPS. Queue, never cancel:
# killing a run mid-extract is how a half-written .output 502s the site.
# GitHub keeps only the newest pending run, which contains every commit.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # Full history: prebuild's generate-changelog reads the last 500
        # commits for the prerendered /changelog. The default depth of 1 made
        # it "1 commits".
        fetch-depth: 0

    - name: Setup Node 22
      uses: actions/setup-node@v7
      with:
        node-version: 22

    # Cache node_modules itself, keyed on the lockfile: a hit skips install
    # entirely (~2s restore vs ~30s for the old yarn-cache restore + install).
    # Nothing before the build needs .nuxt (postinstall's `nuxt prepare`);
    # `nuxt build` regenerates it.
    - name: Restore node_modules
      id: nm_cache
      uses: actions/cache@v6
      with:
        path: node_modules
        key: nm-${{ runner.os }}-node22-${{ hashFiles('yarn.lock') }}

    - name: Install dependencies
      if: steps.nm_cache.outputs.cache-hit != 'true'
      run: yarn install --frozen-lockfile --ignore-engines

    # Blocking, and BEFORE the build, so a visibility-field typo or a leaked
    # sealed post stops the deploy rather than shipping. These also run in
    # guard-sealed.yml on every branch, but that workflow is advisory — it does
    # not gate this one, and a deploy that builds anyway is a deploy that
    # publishes anyway.
    - name: Safety checks
      run: |
        yarn lint:safety
        yarn check:sealed

    # Screenshots are where secrets leak: in 2026-10 published week notes
    # showed a live DB password, API keys and bank statements, and every
    # text-side check passed. OCR each published image (verdicts cached by
    # URL — committed in data/image-pii-scan.json, plus this runner cache for
    # images added since) and block on credentials or financial details.
    - name: Restore image scan cache
      uses: actions/cache@v6
      with:
        path: .cache/image-pii-scan.json
        key: image-pii-${{ github.sha }}
        restore-keys: image-pii-

    # Most deploys have no new images to OCR, so tesseract (~12s of apt) is
    # installed only when the guard has work. The guard still fails closed:
    # any image left to OCR without tesseract fails the deploy.
    - name: Count images awaiting OCR
      id: ocr_todo
      run: echo "count=$(yarn -s check:images --count-todo | tail -1)" >> "$GITHUB_OUTPUT"

    - name: Install tesseract
      if: steps.ocr_todo.outputs.count != '0'
      run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends tesseract-ocr >/dev/null

    # On failure the guard prints WHAT/WHY/HOW TO FIX, adds a red annotation
    # and a run summary, and the next step pings Discord. Override for a
    # broken guard: Run workflow → skip_image_guard.
    - name: Screenshot guard (OCR for secrets and financial details)
      id: image_guard
      run: yarn check:images
      env:
        SKIP_IMAGE_GUARD: ${{ inputs.skip_image_guard }}

    - name: Read screenshot guard alert
      id: guard_alert
      if: failure() && steps.image_guard.outcome == 'failure'
      run: |
        MSG=$(cat .cache/image-guard-alert.txt 2>/dev/null || echo "the guard failed — see the run")
        echo "msg=$MSG" >> "$GITHUB_OUTPUT"

    - name: Alert Discord that the screenshot guard blocked the deploy
      if: failure() && steps.image_guard.outcome == 'failure'
      uses: appleboy/ssh-action@v1.2.5
      env:
        GUARD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        GUARD_MSG: "**🛑 ejfox.com deploy BLOCKED by screenshot guard** — ${{ steps.guard_alert.outputs.msg }} `${{ github.sha }}` ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        envs: GUARD_MSG,GUARD_URL
        script: ALERT_FORCE=1 ALERT_DEEPLINK="$GUARD_URL" /home/debian/scripts/alert.sh website error "$GUARD_MSG"

    - name: Process markdown
      run: yarn blog:process

    # The exact content this deploy ships. send-webmentions + mirror-atproto
    # run after a successful deploy and read THIS, not the checkout's
    # committed JSON (stale for markdown-only commits, e.g. from Dispatch).
    - name: Upload processed content
      uses: actions/upload-artifact@v7
      with:
        name: processed-content
        path: content/processed
        retention-days: 7

    - name: Build (node-server preset)
      run: NITRO_PRESET=node-server yarn build
      env:
        NODE_ENV: production

    - name: Verify and package build
      run: |
        if [ ! -f .output/server/index.mjs ]; then
          echo "ERROR: .output/server/index.mjs not found after build!"
          exit 1
        fi
        # Nitro traces both @napi-rs/canvas Linux binaries. The VPS is Debian
        # (glibc), so the musl one (~30 MB) can never load; don't ship it.
        rm -rf .output/server/node_modules/@napi-rs/canvas-linux-x64-musl
        echo "Build OK: $(du -sh .output | cut -f1)"
        # Ship the processed content CI just generated. The server reads
        # content/processed relative to its cwd (the VPS git checkout), so
        # without this, prod served whatever JSON happened to be committed —
        # a markdown-only edit deployed green and changed nothing.
        tar czf website2-output.tar.gz .output content/processed

    - name: Upload build to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: website2-output.tar.gz
        target: /tmp/

    - name: Deploy and reload
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        command_timeout: 5m
        script: |
          set -e
          DEPLOY_START=$(date +%s)
          ALERT="/home/debian/scripts/alert.sh"

          cd /data2/website2

          # Any exit we didn't plan for (set -e: tar, rsync, pm2…) still alerts.
          # Planned failures set ALERTED=1 before sending their own message.
          ALERTED=""
          trap 'rc=$?; if [ $rc -ne 0 ] && [ -z "$ALERTED" ]; then ALERT_FORCE=1 $ALERT website error "**❌ Deploy script died** (exit $rc) partway through — check /data2/website2 by hand (.output, .output.old, .processed.old)"; fi' EXIT

          # Capture before/after commits. Check out the EXACT commit this run
          # built — not origin/main, which a queued later merge may have moved.
          BUILT_SHA="${{ github.sha }}"
          PREV_SHA=$(git rev-parse HEAD)
          PREV_COMMIT=$(git rev-parse --short HEAD)

          # Snapshot the LIVE processed content before git touches it. The
          # reset below rewrites the tracked content/processed to the new
          # commit's committed JSON, so a snapshot taken after it (as before
          # 2026-11-01) restored the wrong content on rollback.
          rm -rf .processed.old
          cp -a content/processed .processed.old
          restore_live() {
            git reset --hard "$PREV_SHA"
            rsync -a --delete --exclude 'private/' .processed.old/ content/processed/
          }

          git fetch origin main
          git reset --hard "$BUILT_SHA"
          NEW_COMMIT=$(git rev-parse --short HEAD)

          # /api/changelog reads data/changelog.json from this checkout (it's
          # gitignored, so CI's copy never arrives). Regenerate it from the
          # real history; before this it sat frozen at 2026-06-18.
          node scripts/build/generate-changelog.mjs || echo "WARN: changelog regen failed — serving the previous file"

          # Get commit info for alert
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" | head -c 100)
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          COMMIT_DATE=$(git log -1 --pretty=format:"%cr")
          FILES_CHANGED=$(git diff --name-only ${PREV_COMMIT} ${NEW_COMMIT} 2>/dev/null | wc -l || echo "?")
          COMPARE_URL="https://github.com/ejfox/website2/compare/${PREV_COMMIT}...${NEW_COMMIT}"

          # Atomic extract-verify-swap. NEVER destroy the live .output before the
          # new one is proven complete — a truncated tarball or interrupted extract
          # must leave the running site untouched, not headless. (Root cause of the
          # 2026-09-14 outage: rm -rf .output ran before a failed extract → the box
          # had no .output/server/index.mjs at the next pm2 restart → 502.)
          rm -rf .deploy.staging
          mkdir .deploy.staging
          # tarball holds .output/ and content/processed/. A truncated one
          # fails tar; that's a bad transfer too, not a silent set -e exit.
          TAR_OK=1
          tar xzf /tmp/website2-output.tar.gz -C .deploy.staging || TAR_OK=""
          rm -f /tmp/website2-output.tar.gz

          # Verify the STAGED build + content before touching the live ones
          if [ -z "$TAR_OK" ] || \
             [ ! -f .deploy.staging/.output/server/index.mjs ] || \
             [ ! -f .deploy.staging/content/processed/manifest-lite.json ]; then
            echo "ERROR: bad transfer (tar ok: ${TAR_OK:-no}) — keeping live build!"
            rm -rf .deploy.staging
            restore_live
            ALERTED=1
            ALERT_FORCE=1 $ALERT website error "**❌ Deploy FAILED** — bad transfer, live site untouched"
            exit 1
          fi

          # Lay CI's processed content over the checkout (the live copy is in
          # .processed.old). private/ (sealed envelopes) stays git's: a
          # processing bug must never be able to delete one.
          rsync -a --delete --exclude 'private/' \
            .deploy.staging/content/processed/ content/processed/

          # Swap: keep the previous build as .output.old for rollback
          rm -rf .output.old
          [ -d .output ] && mv .output .output.old
          mv .deploy.staging/.output .output
          rm -rf .deploy.staging

          # Graceful reload via pm2
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          pm2 reload website2

          # Verify the NEW build is what's serving: healthcheck must return
          # 200 (manifest ok) AND report the commit we built. Anything else
          # rolls back automatically — a green run means the site works.
          HEALTH="❌"
          for i in $(seq 1 15); do
            sleep 2
            BODY=$(curl -sf http://localhost:3006/api/healthcheck 2>/dev/null || true)
            SERVING=$(echo "$BODY" | grep -o '"commit":"[^"]*"' | cut -d'"' -f4)
            if [ -n "$SERVING" ] && [ "${BUILT_SHA#$SERVING}" != "$BUILT_SHA" ] && \
               echo "$BODY" | grep -q '"manifest":"ok"'; then
              HEALTH="✅"
              break
            fi
          done

          if [ "$HEALTH" != "✅" ]; then
            echo "ERROR: new build not healthy (serving: ${SERVING:-nothing}) — rolling back"
            ALERTED=1
            # No previous build to go back to (e.g. .output was missing when
            # this deploy started): moving the new one aside would leave the
            # box with no build at all. Keep it, restore nothing, and say so.
            if [ ! -f .output.old/server/index.mjs ]; then
              ALERT_FORCE=1 $ALERT website error "**❌ Deploy UNHEALTHY, no rollback possible** \`${NEW_COMMIT}\` failed its health check (serving: ${SERVING:-nothing}) and there is no .output.old. Left the new build in place — fix by hand."
              exit 1
            fi
            rm -rf .output.failed
            mv .output .output.failed
            mv .output.old .output
            restore_live
            pm2 reload website2
            # Prove the rollback took: healthcheck must report the PREVIOUS commit.
            BACK="no"
            for i in $(seq 1 15); do
              sleep 2
              RB=$(curl -sf http://localhost:3006/api/healthcheck 2>/dev/null | grep -o '"commit":"[^"]*"' | cut -d'"' -f4 || true)
              if [ -n "$RB" ] && [ "${PREV_SHA#$RB}" != "$PREV_SHA" ]; then BACK="yes"; break; fi
            done
            if [ "$BACK" = "yes" ]; then
              ALERT_FORCE=1 $ALERT website error "**❌ Deploy ROLLED BACK** \`${NEW_COMMIT}\` failed its health check (serving: ${SERVING:-nothing}). Back on \`${PREV_COMMIT}\` and healthy. Failed build kept at .output.failed"
            else
              ALERT_FORCE=1 $ALERT website error "**🔥 ROLLBACK UNHEALTHY** \`${NEW_COMMIT}\` failed, and after rolling back to \`${PREV_COMMIT}\` the healthcheck still doesn't report it (got: ${RB:-nothing}). Site may be down — check now."
            fi
            exit 1
          fi

          # Warm the SSR listings (and the /api/github + /api/stats caches; /stats
          # renders stats server-side) so the first real
          # visitor after a restart doesn't pay the ~2.5s cold render.
          for p in / /blog /projects /api/stats; do
            curl -s -o /dev/null "http://localhost:3006$p" || true
          done

          # Process stats
          PROCESS_MEM=$(pm2 info website2 2>/dev/null | grep -i memory | head -1 | awk '{print $NF}' || echo "?")
          OUTPUT_SIZE=$(du -sh .output 2>/dev/null | cut -f1 || echo "?")

          DEPLOY_TIME=$(($(date +%s) - DEPLOY_START))

          # Send hyper-dense Discord alert
          ALERT_MSG="**🚀 ejfox.com deployed** ${HEALTH}
          \`${PREV_COMMIT}\`→\`${NEW_COMMIT}\` ${COMMIT_DATE}
          **${COMMIT_MSG}**
          by ${COMMIT_AUTHOR} | [diff](${COMPARE_URL})
          **Δ** ${FILES_CHANGED} files | **Output:** ${OUTPUT_SIZE} | **Mem:** ${PROCESS_MEM}
          **Built on GH runner** | **total:${DEPLOY_TIME}s**"

          ALERT_FORCE=1 $ALERT website info "$ALERT_MSG"

    # Cloudflare caches HTML per origin s-maxage. Every deploy replaces the
    # hashed /_nuxt chunks, so cached HTML from the old build would point at
    # files that no longer exist: purge the zone once the new build is live.
    # No-op (with a notice) until the token secret exists.
    - name: Purge Cloudflare cache
      env:
        CF_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      run: |
        if [ -z "$CF_TOKEN" ] || [ -z "$CF_ZONE" ]; then
          echo "::notice::CLOUDFLARE_PURGE_TOKEN / CLOUDFLARE_ZONE_ID not set, skipping purge"
          exit 0
        fi
        RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
          -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
          --data '{"purge_everything":true}' | grep -o '"success":[a-z]*' || true)
        echo "purge: ${RESULT:-no response}"
        [ "$RESULT" = '"success":true' ] || { echo "::warning::Cloudflare purge failed"; exit 1; }

    # The VPS step already proved localhost serves the new commit (or rolled
    # back and failed). This proves the public path — tunnel + Cloudflare —
    # serves it too, so a green run means ejfox.com itself is updated.
    - name: Verify public site serves this commit
      run: |
        for i in $(seq 1 10); do
          SERVING=$(curl -sf "https://ejfox.com/api/healthcheck?v=${GITHUB_SHA}" | grep -o '"commit":"[^"]*"' | cut -d'"' -f4 || true)
          if [ -n "$SERVING" ] && [ "${GITHUB_SHA#$SERVING}" != "$GITHUB_SHA" ]; then
            echo "✅ ejfox.com serving ${SERVING}"
            exit 0
          fi
          sleep 3
        done
        echo "❌ ejfox.com is serving '${SERVING:-nothing}', expected ${GITHUB_SHA:0:8}"
        exit 1

    # The 54-check smoke test (scripts/meta/smoke-prod.mjs): pages, feeds, APIs,
    # redirects, guards, secrets. The deploy is already verified above, so this
    # never fails the run or rolls back; a failure becomes a Discord alert.
    - name: Smoke-test the live site
      id: smoke
      continue-on-error: true
      run: |
        set -o pipefail
        node scripts/meta/smoke-prod.mjs 2>&1 | tee /tmp/smoke.txt
      # (no --browser: Chromium isn't installed on the runner; run `yarn smoke` locally)

    - name: Read smoke failures
      id: smoke_alert
      if: steps.smoke.outcome == 'failure'
      run: |
        FAILS=$(grep -E '^\s+✗' /tmp/smoke.txt | head -6 | sed 's/^ *//' | tr '\n' ';' || true)
        echo "msg=${FAILS:-smoke crashed, see the run}" >> "$GITHUB_OUTPUT"

    - name: Alert Discord that the smoke test failed
      if: steps.smoke.outcome == 'failure'
      uses: appleboy/ssh-action@v1.2.5
      env:
        SMOKE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SMOKE_MSG: "**⚠️ ejfox.com smoke test failed after deploy** `${{ github.sha }}` — ${{ steps.smoke_alert.outputs.msg }}"
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        envs: SMOKE_MSG,SMOKE_URL
        script: ALERT_FORCE=1 ALERT_DEEPLINK="$SMOKE_URL" /home/debian/scripts/alert.sh website warning "$SMOKE_MSG"
