name: Sealed-post guard

# Every branch and every PR, NOT just main. A plaintext push to a feature
# branch of a public repo is already public — waiting until it reaches main is
# waiting until after the leak.
#
# Needs no secrets and no key: it only inspects what is tracked. That is the
# design working as intended — the GitHub Actions runner is never trusted with
# a sealed post's plaintext and never holds a key, so a fork PR, a compromised
# action, or a leaked repo secret cannot open one.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only the two packages the guard imports; a full `yarn install` would be
      # a minute of CI for a check that has to be fast enough that nobody is
      # tempted to skip it. Installed OUTSIDE the repo: `npm install <pkg>` here
      # resolves the whole yarn package.json tree, which newer npm crashes on
      # ("Cannot read properties of null (reading 'edgesOut')", 2026-10-16).
      - name: Install guard deps (isolated)
        run: |
          npm install --prefix "$RUNNER_TEMP/guard-deps" --no-audit --no-fund chalk@5 gray-matter@4
          ln -s "$RUNNER_TEMP/guard-deps/node_modules" node_modules

      - name: No sealed plaintext, no keyring, envelope-only JSON
        run: node scripts/meta/check-sealed.mjs

      - name: Frontmatter safety
        run: node scripts/meta/lint-frontmatter-safety.mjs
