name: Mirror to AT-Proto

# After every SUCCESSFUL production deploy, so it acts on what's actually
# live — not on a path filter over committed JSON (which markdown-only
# commits from Dispatch never touch) plus a `sleep 60` guess.
on:
  workflow_run:
    workflows: ['Deploy to VPS']
    types: [completed]
  workflow_dispatch:
    inputs:
      prune:
        description: 'Also delete orphaned pre-TID records (one-off cleanup)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  mirror:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    # Use the processed content the deploy built (see deploy.yml)
    - name: Use deployed processed content
      if: github.event_name == 'workflow_run'
      run: rm -rf content/processed

    - name: Download deployed processed content
      if: github.event_name == 'workflow_run'
      uses: actions/download-artifact@v4
      with:
        name: processed-content
        path: content/processed
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install deps
      run: yarn install --frozen-lockfile --ignore-engines

    - name: Mirror published posts to AT-Proto
      env:
        ATPROTO_HANDLE: ${{ secrets.ATPROTO_HANDLE }}
        ATPROTO_APP_PASSWORD: ${{ secrets.ATPROTO_APP_PASSWORD }}
      run: |
        if [ -z "$ATPROTO_APP_PASSWORD" ]; then
          echo "No ATPROTO_APP_PASSWORD secret set — skipping AT-Proto mirror."
          exit 0
        fi
        node scripts/author/mirror-to-atproto.mjs --live

    # Opt-in, manual only. Deletes records whose rkey isn't a valid TID, i.e.
    # the pre-migration set. Runs after the mirror so the live records exist
    # before their duplicates are removed.
    - name: Prune orphaned pre-TID records
      if: github.event_name == 'workflow_dispatch' && inputs.prune
      env:
        ATPROTO_HANDLE: ${{ secrets.ATPROTO_HANDLE }}
        ATPROTO_APP_PASSWORD: ${{ secrets.ATPROTO_APP_PASSWORD }}
      run: |
        # Dry run first so the log shows exactly what is about to go, then do it.
        node scripts/author/prune-atproto-orphans.mjs
        node scripts/author/prune-atproto-orphans.mjs --live
